[project]
name = "playfab-cli-unofficial"
version = "0.1.0"
description = "pfcli: unofficial command-line tool for Microsoft PlayFab titles (not affiliated with Microsoft)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eric Soto" }]
keywords = ["playfab", "cli", "gamedev", "liveops", "leaderboards", "cloudscript"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.5.1",
    "jmespath>=1.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
pfcli = "pfcli.cli:main"

[project.urls]
Homepage = "https://github.com/ericwastaken/playfab-cli-unofficial"
Documentation = "https://ericwastaken.github.io/playfab-cli-unofficial/"
Issues = "https://github.com/ericwastaken/playfab-cli-unofficial/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfcli"]

[tool.hatch.build.targets.sdist]
include = ["src/pfcli", "README.md", "LICENSE", "pfcli-config.example.yml", "pfcli-secrets.example.yml"]
