# pfcli configuration. Copy to pfcli-config.yml, or pfcli-config-<client>.yml (both
# gitignored), and edit for your titles. Secret keys never go here: they live in the
# paired pfcli-secrets[-<client>].yml, keyed by title_id.

defaults:
  # Server API host. {title_id} is substituted. Titles on a dedicated cluster
  # override this per title (e.g. "https://{title_id}.<cluster>.playfabapi.com").
  host: "https://{title_id}.playfabapi.com"

titles:
  # alias: short label used on the command line and in output files
  GAME-PROD:
    title_id: ABCD1
    description: Example production title
  GAME-DEV:
    title_id: ABCD2
    description: Example dev title on a dedicated cluster
    host: "https://{title_id}.example-cluster.playfabapi.com"
